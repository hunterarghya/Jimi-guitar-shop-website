version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jimi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jimi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jimi_network

  mongo:
    image: mongo:latest
    container_name: jimi_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongodb}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongodb}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-jimi}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jimi_network

  redis:
    image: redis:7-alpine
    container_name: jimi_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jimi_network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jimi_app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jimi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-jimi}
      MONGO_USER: ${MONGO_USER:-mongodb}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-mongodb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-xxx}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-xxx}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-xxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-xxx}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-xxx}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-xxx}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-xxx}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-xxx}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-xxx}
      SENDER_EMAIL: ${SENDER_EMAIL:-noreply@jimi.local}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
      - jimi_network

  nginx:
    image: nginx:alpine
    container_name: jimi_nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jimi_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  jimi_network:
    driver: bridge
