<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimi Admin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-container {
        background: white;
        padding: 60px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        max-width: 450px;
        width: 100%;
      }

      .admin-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .admin-title {
        font-size: 32px;
        font-weight: 700;
        color: #1a1a2e;
        margin-bottom: 10px;
      }

      .admin-subtitle {
        color: #999;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        outline: none;
        border-color: #1a1a2e;
        box-shadow: 0 0 0 3px rgba(26, 26, 46, 0.1);
      }

      .error {
        color: #d32f2f;
        background: #ffebee;
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .success {
        color: #388e3c;
        background: #e8f5e9;
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .login-btn {
        width: 100%;
        padding: 12px 20px;
        background: #1a1a2e;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
      }

      .login-btn:hover {
        background: #0f3460;
      }

      .login-btn.loading {
        opacity: 0.6;
        pointer-events: none;
      }

      .warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="admin-header">
        <div class="admin-title">🎸 Jimi Admin</div>
        <div class="admin-subtitle">Management Dashboard</div>
      </div>

      <div class="warning">
        ⚠️ This is a restricted admin area. Unauthorized access is prohibited.
      </div>

      <div class="error" id="errorMsg"></div>
      <div class="success" id="successMsg"></div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="admin@example.com" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
        />
      </div>

      <button class="login-btn" onclick="handleAdminLogin()">
        Login as Admin
      </button>

      <div style="text-align: center; margin-top: 30px">
        <a
          href="../user/login.html"
          style="
            color: #1a1a2e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
          "
          >Not an admin? Go to user login →</a
        >
      </div>
    </div>

    <script src="../shared/api.js"></script>
    <script>
      window.addEventListener("load", () => {
        if (TokenManager.getAccessToken() && TokenManager.isAdmin()) {
          window.location.href = "dashboard.html";
        }
      });

      function showError(message) {
        const errorDiv = document.getElementById("errorMsg");
        errorDiv.textContent = message;
        errorDiv.style.display = "block";
        setTimeout(() => {
          errorDiv.style.display = "none";
        }, 5000);
      }

      function showSuccess(message) {
        const successDiv = document.getElementById("successMsg");
        successDiv.textContent = message;
        successDiv.style.display = "block";
      }

      async function handleAdminLogin() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const btn = event.target;

        if (!email || !password) {
          showError("Email and password are required");
          return;
        }

        try {
          btn.classList.add("loading");
          const response = await AuthAPI.login(email, password);

          // Check if user is admin
          if (!response.is_admin) {
            showError("This account does not have admin access");
            btn.classList.remove("loading");
            return;
          }

          TokenManager.setTokens(response.access_token, response.refresh_token);
          showSuccess("Admin login successful!");

          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } catch (error) {
          showError(error.message);
          btn.classList.remove("loading");
        }
      }

      // Allow Enter key to submit
      document.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          handleAdminLogin();
        }
      });
    </script>
  </body>
</html>
